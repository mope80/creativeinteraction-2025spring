<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Responsive Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <body>

    <div class="container-fluid py-2 border-bottom">
    <div class="row align-items-center">

        <img src="培.png" alt="Logo" class="img-fluid" style="max-height: 50px;">
      </div>


      <div class="col-12 col-md-2 mb-2 mb-md-0">
        <select class="form-select form-select-sm" style="height: 32px;">
          <option selected>选择地点</option>
          <option value="1">北京</option>
          <option value="2">上海</option>
          <option value="3">广州</option>
        </select>
      </div>


      <div class="col-12 col-md-8">
        <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="搜索课程" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">🔍</button>
      </form>
      </div>
    </div>
  </div>
